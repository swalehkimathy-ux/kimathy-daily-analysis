name: Kimathy manual analysis

on:
  workflow_dispatch:
    inputs:
      confirm_requests:
        description: "Confirm sports API requests (may use API credits)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kimathy-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-daily-ticket:
    # Safety guard: no API requests unless the caller explicitly confirms.
    if: ${{ inputs.confirm_requests == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pipeline dependency
        run: python -m pip install -r pipeline/requirements.txt
      - name: Filter fixtures and build accumulator
        run: python pipeline/run_daily.py
        env:
          # API credentials stay in GitHub Actions Secrets; never put them in config.js.
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          # Use API_SPORTS_KEY for one shared dashboard key, or the two
          # product-specific secrets if Football/Basketball provide separate keys.
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_REGION: eu
          ODDS_API_SPORT_KEYS: ${{ vars.ODDS_API_SPORT_KEYS }}
          ODDS_API_MAX_AGE_MINUTES: '360'
          # Optional fallback when using a separate, already-normalized feed.
          SPORTS_FEED_URL: ${{ secrets.SPORTS_FEED_URL }}
          SPORTS_FEED_TOKEN: ${{ secrets.SPORTS_FEED_TOKEN }}
