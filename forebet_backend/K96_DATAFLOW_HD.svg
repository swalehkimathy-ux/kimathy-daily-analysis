  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- ── TITLE ─────────────────────────────────────── -->
  <text x="800" y="58" text-anchor="middle" font-size="38" font-weight="800" fill="#e9f0ea" letter-spacing="1">K96 PICKS — Data Flow ya Kivutio</text>
