    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fc584"/><stop offset="1" stop-color="#1a9d63"/>
    </linearGradient>
    <linearGradient id="bx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151c18"/><stop offset="1" stop-color="#111614"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
